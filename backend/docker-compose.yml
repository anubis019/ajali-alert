version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - AJALI_SECRET_KEY=change-me-to-a-long-random-string
      - DATABASE_URL=sqlite+aiosqlite:///./data/ajali.db
    volumes:
      - ajali-data:/app/data
    restart: unless-stopped

volumes:
  ajali-data: