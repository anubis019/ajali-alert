version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ajali
      POSTGRES_USER: ajali
      POSTGRES_PASSWORD: ajali
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://ajali:ajali@postgres:5432/ajali
      SECRET_KEY: dev-secret-key
      DEBUG: "true"
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
