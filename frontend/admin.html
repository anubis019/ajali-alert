<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ajali Alert Admin</title>
  <style>
    :root {
      --bg: #0f1720;
      --panel: #16212c;
      --panel-2: #1d2a35;
      --line: #2a3946;
      --text: #edf3f8;
      --muted: #9aa8b5;
      --green: #39b08f;
      --amber: #e0a73b;
      --red: #e3535a;
      --blue: #72a9ff;
      --shadow: 0 14px 30px rgba(0,0,0,.25);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, #0c131a, #111b25 35%, #15212d);
      color: var(--text);
      min-height: 100vh;
    }

    /* ---------------- Top bar ---------------- */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(13,22,30,0.85);
      backdrop-filter: blur(8px);
      position: sticky; top: 0; z-index: 30;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: -0.02em; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--red), #ff7b7b);
      display: grid; place-items: center;
      font-size: 12px; font-weight: 800; letter-spacing: 0.08em;
    }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .user-chip { font-size: 13px; color: var(--muted); }
    .user-chip strong { color: var(--text); }

    .conn-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      border: 1px solid var(--line); color: var(--muted);
    }
    .conn-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .conn-badge.live { border-color: rgba(57,176,143,0.5); color: #7edbb7; }
    .conn-badge.live .dot { box-shadow: 0 0 0 3px rgba(57,176,143,0.25); }
    .conn-badge.offline { border-color: rgba(227,83,90,0.5); color: #ff9a9e; }

    /* ---------------- Buttons ---------------- */
    .btn {
      border: 0; border-radius: 10px; padding: 9px 14px;
      font-weight: 700; cursor: pointer; font-size: 13px; font-family: inherit;
      transition: transform .15s ease, opacity .15s ease;
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .btn-primary { background: linear-gradient(135deg, var(--red), #ef6f75); color: #fff; }
    .btn-secondary { background: #1c2d39; color: var(--text); border: 1px solid var(--line); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .btn-green { background: linear-gradient(135deg, #2c9576, var(--green)); color: #fff; }
    .btn-sm { padding: 6px 10px; font-size: 12px; }

    /* ---------------- Shell ---------------- */
    .shell { max-width: 1400px; margin: 0 auto; padding: 24px 20px 60px; }
    h1 { margin: 0 0 4px; font-size: clamp(26px, 4vw, 36px); letter-spacing: -0.04em; }
    h2 { margin: 0 0 14px; font-size: 17px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); margin-bottom: 22px; font-size: 14px; }
    .last-updated { color: var(--muted); font-size: 11px; margin-left: 8px; }

    /* ---------------- Stats ---------------- */
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px; margin: 0 0 22px;
    }
    .stat {
      background: rgba(22,33,44,0.95);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 18px;
      box-shadow: var(--shadow);
    }
    .stat-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
    .stat-value { font-size: clamp(22px, 3.5vw, 32px); font-weight: 800; letter-spacing: -0.04em; }

    /* ---------------- Content grid ---------------- */
    .content { display: grid; grid-template-columns: 1.4fr .9fr; gap: 18px; }
    .panel {
      background: rgba(22,33,44,0.95);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--shadow);
    }
    .stack { display: grid; gap: 14px; align-content: start; }

    /* ---------------- Filters ---------------- */
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .filters input, .filters select {
      background: rgba(13, 19, 24, 0.85);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px; font-family: inherit;
      outline: none;
    }
    .filters input:focus, .filters select:focus { border-color: #3a5561; }
    .filters input { flex: 1; min-width: 200px; }

    /* ---------------- Table ---------------- */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; }
    tbody tr { cursor: pointer; transition: background .12s ease; }
    tbody tr:hover { background: rgba(114,169,255,0.05); }
    tbody tr.selected { background: rgba(57, 176, 143, 0.08); }
    tbody tr:focus-visible { outline: 2px solid var(--green); outline-offset: -2px; }

    .status-pill {
      display: inline-flex; align-items: center;
      padding: 4px 9px; border-radius: 999px;
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
      white-space: nowrap;
    }
    .NEW, .DISPATCHING { background: rgba(114,169,255,0.14); color: #9dc0ff; }
    .EN_ROUTE { background: rgba(224,167,59,0.14); color: #f0c76a; }
    .ESCALATED { background: rgba(227,83,90,0.14); color: #ff9a9e; }
    .ARRIVED, .RESOLVED { background: rgba(57,176,143,0.14); color: #7edbb7; }
    .CLOSED, .CANCELLED, .FALSE_ALERT { background: rgba(159,168,177,0.18); color: #d9e0e7; }
    .muted { color: var(--muted); }

    /* ---------------- Cards / recent ---------------- */
    .list { display: grid; gap: 10px; }
    .mini-card {
      border: 1px solid var(--line);
      background: rgba(29,42,53,0.9);
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color .15s ease;
    }
    .mini-card:hover { border-color: rgba(114,169,255,0.5); }
    .mini-card strong { display: block; font-size: 13px; margin-bottom: 4px; }
    .mini-meta { font-size: 12px; color: var(--muted); }

    /* ---------------- Responders ---------------- */
    .responder-panel { display: grid; gap: 8px; max-height: 340px; overflow: auto; margin-top: 8px; }
    .responder-card {
      border: 1px solid var(--line); border-radius: 10px;
      background: rgba(29, 42, 53, 0.9);
      padding: 10px 12px; display: grid; gap: 4px;
      transition: border-color .15s ease;
    }
    .responder-card:hover { border-color: rgba(114,169,255,0.6); }
    .responder-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .responder-meta { color: var(--muted); font-size: 11px; }

    /* ---------------- Chat ---------------- */
    .chat-box { display: grid; gap: 10px; margin-top: 8px; }
    .chat-thread {
      min-height: 120px; max-height: 220px; overflow: auto;
      padding: 12px; border-radius: 12px;
      background: rgba(10, 17, 22, 0.48);
      border: 1px solid var(--line);
      display: grid; gap: 8px;
    }
    .msg { max-width: 88%; padding: 9px 12px; border-radius: 12px; font-size: 13px; line-height: 1.5; }
    .msg.user { justify-self: end; background: rgba(114,169,255,0.14); border: 1px solid rgba(114,169,255,0.4); }
    .msg.ai { justify-self: start; background: rgba(57,176,143,0.12); border: 1px solid rgba(57,176,143,0.45); }
    .chat-input-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .chat-input-row input {
      width: 100%;
      background: rgba(13, 19, 24, 0.85);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 13px; font-family: inherit;
      outline: none;
    }
    .chat-input-row input:focus { border-color: #3a5561; }

    /* ---------------- Incident drawer ---------------- */
    .incident-drawer {
      position: fixed; right: 20px; top: 82px;
      width: min(440px, calc(100vw - 32px));
      max-height: calc(100vh - 100px);
      overflow: auto;
      background: rgba(22, 33, 44, 0.99);
      border: 1px solid var(--line);
      border-radius: 16px; box-shadow: var(--shadow);
      padding: 20px; display: none; z-index: 25;
    }
    .incident-drawer.visible { display: block; }
    .drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
    .drawer-head h2 { margin: 0; font-size: 17px; }
    .drawer-section { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
    .drawer-section h3 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
    .drawer-grid { display: grid; gap: 8px; font-size: 13px; color: var(--muted); }
    .drawer-grid strong { color: var(--text); }
    .drawer-grid .row-flex { display: flex; justify-content: space-between; gap: 10px; align-items: center; }

    /* ---------------- Timeline ---------------- */
    .timeline { display: grid; gap: 10px; }
    .tl-item { display: grid; grid-template-columns: 10px 1fr; gap: 10px; align-items: start; font-size: 12px; }
    .tl-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); margin-top: 4px; }
    .tl-body { color: var(--muted); }
    .tl-body strong { color: var(--text); display: block; font-size: 12px; margin-bottom: 2px; text-transform: capitalize; }

    /* ---------------- Action bar ---------------- */
    .action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

    /* ---------------- Toasts ---------------- */
    .toasts {
      position: fixed; bottom: 20px; right: 20px;
      display: grid; gap: 10px; z-index: 200;
      max-width: 360px;
    }
    .toast {
      background: rgba(22, 33, 44, 0.98);
      border: 1px solid var(--line);
      border-left: 4px solid var(--blue);
      border-radius: 10px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
      font-size: 13px;
      animation: slideIn .25s ease;
    }
    .toast.success { border-left-color: var(--green); }
    .toast.error { border-left-color: var(--red); }
    .toast.warn { border-left-color: var(--amber); }
    .toast strong { display: block; margin-bottom: 3px; }
    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }

    /* ---------------- Login overlay ---------------- */
    .login-overlay {
      position: fixed; inset: 0;
      background: rgba(8, 12, 16, 0.88);
      backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center;
      z-index: 100; padding: 20px;
    }
    .login-overlay.visible { display: flex; }
    .login-card {
      width: min(420px, 100%);
      background: rgba(22, 33, 44, 0.98);
      border: 1px solid var(--line);
      border-radius: 16px; padding: 28px; box-shadow: var(--shadow);
    }
    .login-card h2 { margin: 0 0 6px; font-size: 22px; }
    .login-card p { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
    .login-card label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
    .login-card input {
      width: 100%;
      background: rgba(13, 19, 24, 0.85);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px; margin-bottom: 14px; font-family: inherit;
      outline: none;
    }
    .login-card input:focus { border-color: #3a5561; }
    .login-error { color: #ff8a8a; font-size: 13px; margin-top: 10px; min-height: 18px; }

    /* ---------------- Misc ---------------- */
    .hidden { display: none !important; }
    kbd {
      background: rgba(255,255,255,.06); border: 1px solid var(--line);
      border-radius: 4px; padding: 1px 5px; font-size: 11px; font-family: inherit;
    }
    .case-row { display: flex; align-items: center; gap: 8px; }

    @media (max-width: 1000px) {
      .content { grid-template-columns: 1fr; }
      .incident-drawer { right: 16px; left: 16px; width: auto; top: auto; bottom: 16px; max-height: 70vh; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">AL</div>
      <span>Ajali Alert Admin</span>
    </div>
    <div class="top-actions">
      <span class="conn-badge" id="conn-badge"><span class="dot"></span><span id="conn-label">Connecting…</span></span>
      <span class="user-chip" id="user-chip"></span>
      <button class="btn btn-ghost btn-sm" id="open-citizen-btn">Citizen view</button>
      <button class="btn btn-secondary btn-sm" id="logout-btn">Log out</button>
    </div>
  </header>

  <!-- Login overlay -->
  <div class="login-overlay" id="login-overlay">
    <div class="login-card">
      <h2>Staff sign in</h2>
      <p>Dispatcher, supervisor, or admin access.</p>
      <label for="login-email">Email</label>
      <input id="login-email" type="email" autocomplete="username" placeholder="admin@example.com" />
      <label for="login-password">Password</label>
      <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••" />
      <button class="btn btn-primary" id="login-btn" style="width:100%;">Sign in</button>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>

  <div class="shell">
    <h1>Operations overview</h1>
    <p class="sub">
      Live incident feed, dispatch controls, and responder status.
      <span class="last-updated" id="last-updated"></span>
    </p>

    <section class="stats" id="stats"></section>

    <section class="content">
      <div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px;">
          <h2 style="margin:0;">Live incidents</h2>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-ghost btn-sm" id="export-btn">Export CSV</button>
            <button class="btn btn-primary btn-sm" id="refresh-btn">Refresh <kbd>R</kbd></button>
          </div>
        </div>

        <div class="filters">
          <input id="search-input" type="search" placeholder="Search case number, location, description…" />
          <select id="status-filter">
            <option value="">All statuses</option>
            <option value="NEW">New</option>
            <option value="DISPATCHING">Dispatching</option>
            <option value="EN_ROUTE">En route</option>
            <option value="ESCALATED">Escalated</option>
            <option value="ARRIVED">Arrived</option>
            <option value="RESOLVED">Resolved</option>
            <option value="CLOSED">Closed</option>
          </select>
          <select id="priority-filter">
            <option value="">All priorities</option>
            <option value="5">Level 5 (Critical)</option>
            <option value="4">Level 4</option>
            <option value="3">Level 3</option>
            <option value="2">Level 2</option>
            <option value="1">Level 1</option>
          </select>
        </div>

        <div style="overflow:auto;">
          <table>
            <thead>
              <tr>
                <th>Case</th>
                <th>Status</th>
                <th>Priority</th>
                <th>Type</th>
                <th>Location</th>
                <th>Created</th>
              </tr>
            </thead>
            <tbody id="incident-table-body"></tbody>
          </table>
        </div>
      </div>

      <div class="stack">
        <div class="panel">
          <h2>Recent activity</h2>
          <div class="list" id="recent-activity"></div>
        </div>

        <div class="panel">
          <h2>Responders</h2>
          <div class="responder-panel" id="responder-panel"></div>
        </div>

        <div class="panel">
          <h2>AI assistant</h2>
          <div class="chat-box">
            <div class="chat-thread" id="chat-thread"></div>
            <div class="chat-input-row">
              <input id="assistant-input" type="text" placeholder="Ask about an incident…" />
              <button class="btn btn-primary" id="assistant-send">Send</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div class="incident-drawer" id="incident-drawer">
    <div class="drawer-head">
      <h2 id="drawer-title">Incident</h2>
      <button class="btn btn-ghost btn-sm" id="drawer-close">Close <kbd>Esc</kbd></button>
    </div>
    <div id="incident-drawer-content"></div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script>
    // =====================================================================
    // CONFIG
    // =====================================================================
    const IS_LOCAL = ['localhost', '127.0.0.1'].includes(window.location.hostname);
    const API = IS_LOCAL ? 'http://localhost:8000' : 'https://ajali-alert.onrender.com';
    const WS_URL = API.replace(/^http/, 'ws') + '/ws';

    const OPERATIONAL_ROLES = ['ADMIN', 'SUPER_ADMIN', 'DISPATCHER', 'SUPERVISOR', 'RESPONDER'];
    const POLL_INTERVAL_MS = 20_000;

    const VALID_TRANSITIONS = {
      NEW: ['DISPATCHING', 'ESCALATED', 'CANCELLED'],
      DISPATCHING: ['EN_ROUTE', 'ESCALATED', 'CANCELLED'],
      ESCALATED: ['DISPATCHING', 'CANCELLED'],
      EN_ROUTE: ['ARRIVED', 'CANCELLED'],
      ARRIVED: ['RESOLVED'],
      RESOLVED: ['CLOSED'],
      CLOSED: [],
      CANCELLED: [],
      FALSE_ALERT: [],
    };

    // =====================================================================
    // UTIL
    // =====================================================================
    /** Escape user-controlled strings before inserting into innerHTML. */
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
    function fmtDate(iso) {
      if (!iso) return '—';
      try { return new Date(iso).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }); }
      catch { return iso; }
    }
    function pill(status) {
      const label = esc((status || '').replace(/_/g, ' '));
      return `<span class="status-pill ${esc(status)}">${label}</span>`;
    }

    // =====================================================================
    // AUTH
    // =====================================================================
    const TOKEN_KEY = 'ajali_token';
    const REFRESH_KEY = 'ajali_refresh';
    const USER_KEY = 'ajali_user';

    const getToken   = () => localStorage.getItem(TOKEN_KEY);
    const getRefresh = () => localStorage.getItem(REFRESH_KEY);
    const getUser = () => {
      try { return JSON.parse(localStorage.getItem(USER_KEY) || 'null'); }
      catch { return null; }
    };
    const setSession = (data, user) => {
      localStorage.setItem(TOKEN_KEY, data.access_token);
      localStorage.setItem(REFRESH_KEY, data.refresh_token);
      if (user) localStorage.setItem(USER_KEY, JSON.stringify(user));
    };
    const clearSession = () => {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(REFRESH_KEY);
      localStorage.removeItem(USER_KEY);
    };
    const hasValidRole = (role) => OPERATIONAL_ROLES.includes(role);

    async function apiFetch(path, options = {}, retry = true) {
      const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
      const token = getToken();
      if (token) headers['Authorization'] = `Bearer ${token}`;

      let res;
      try {
        res = await fetch(`${API}${path}`, { ...options, headers });
      } catch (err) {
        throw new Error('Network error — could not reach the server.');
      }

      if (res.status === 401 && retry && getRefresh()) {
        const ok = await tryRefresh();
        if (ok) return apiFetch(path, options, false);
        clearSession();
        showLogin();
        throw new Error('Session expired. Please sign in again.');
      }
      return res;
    }

    async function tryRefresh() {
      try {
        const res = await fetch(`${API}/api/v1/auth/refresh`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: getRefresh() }),
        });
        if (!res.ok) return false;
        const d = await res.json();
        localStorage.setItem(TOKEN_KEY, d.access_token);
        localStorage.setItem(REFRESH_KEY, d.refresh_token);
        return true;
      } catch { return false; }
    }

    // =====================================================================
    // TOASTS
    // =====================================================================
    function toast(message, kind = 'info', title = '') {
      const el = document.createElement('div');
      el.className = `toast ${kind}`;
      el.innerHTML = (title ? `<strong>${esc(title)}</strong>` : '') + esc(message);
      document.getElementById('toasts').appendChild(el);
      setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; }, 4200);
      setTimeout(() => el.remove(), 4600);
    }

    // =====================================================================
    // STATE
    // =====================================================================
    const state = {
      incidents: [],
      summary: null,
      selectedIncidentId: null,
      search: '',
      statusFilter: '',
      priorityFilter: '',
      lastUpdated: null,
    };

    // =====================================================================
    // WEBSOCKET
    // =====================================================================
    let ws = null;
    let reconnectTimer = null;
    let pollTimer = null;

    function setConnBadge(kind) {
      const badge = document.getElementById('conn-badge');
      const label = document.getElementById('conn-label');
      badge.classList.remove('live', 'offline');
      if (kind === 'live')      { badge.classList.add('live');    label.textContent = 'Live'; }
      else if (kind === 'offline') { badge.classList.add('offline'); label.textContent = 'Polling'; }
      else                      { label.textContent = 'Connecting…'; }
    }

    function connectWS() {
      if (!getToken()) return;
      try {
        ws = new WebSocket(WS_URL);
        ws.onopen = () => setConnBadge('live');
        ws.onmessage = (evt) => {
          try { handleWSEvent(JSON.parse(evt.data)); } catch { /* ignore */ }
        };
        ws.onclose = () => { setConnBadge('offline'); ws = null; scheduleReconnect(); };
        ws.onerror = () => { try { ws.close(); } catch {} };
      } catch { setConnBadge('offline'); scheduleReconnect(); }
    }

    function scheduleReconnect() {
      if (reconnectTimer) return;
      reconnectTimer = setTimeout(() => { reconnectTimer = null; connectWS(); }, 5000);
    }

    function disconnectWS() {
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      if (ws) { try { ws.close(); } catch {} ws = null; }
    }

    function handleWSEvent({ event, data }) {
      if (!event || !data) return;
      if (event === 'incident.created') {
        toast(`Case ${data.incident_number} · priority ${data.priority}`, 'warn', '🚨 New incident');
        loadDashboard();
      } else if (event === 'incident.updated') {
        toast(`Case ${data.incident_number} → ${data.status}`, 'info', 'Status update');
        loadDashboard();
        if (state.selectedIncidentId === data.id) refreshDrawer();
      } else if (event === 'dispatch.updated') {
        toast('Responder assigned', 'success', 'Dispatch');
        loadDashboard();
        if (state.selectedIncidentId === data.id) refreshDrawer();
      }
    }

    // =====================================================================
    // LOGIN
    // =====================================================================
    function showLogin() { document.getElementById('login-overlay').classList.add('visible'); }
    function hideLogin() { document.getElementById('login-overlay').classList.remove('visible'); }

    async function doLogin() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const errEl = document.getElementById('login-error');
      errEl.textContent = '';
      if (!email || !password) { errEl.textContent = 'Enter email and password.'; return; }

      try {
        const res = await fetch(`${API}/api/v1/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        if (!res.ok) {
          const d = await res.json().catch(() => ({}));
          errEl.textContent = d.detail || 'Invalid email or password.';
          return;
        }
        const d = await res.json();
        setSession(d, { email });

        // Fetch full profile and validate role
        const meRes = await apiFetch('/api/v1/auth/me');
        if (!meRes.ok) { errEl.textContent = 'Could not verify your account.'; clearSession(); return; }
        const me = await meRes.json();
        if (!hasValidRole(me.role)) {
          errEl.textContent = `Your account (${me.role}) does not have dashboard access.`;
          clearSession();
          return;
        }
        localStorage.setItem(USER_KEY, JSON.stringify(me));
        renderUserChip();
        hideLogin();
        startDashboard();
      } catch (err) {
        errEl.textContent = err.message || 'Could not reach the server.';
      }
    }

    function renderUserChip() {
      const u = getUser();
      document.getElementById('user-chip').innerHTML = u && u.email
        ? `Signed in as <strong>${esc(u.email)}</strong>${u.role ? ' · ' + esc(u.role) : ''}`
        : '';
    }

    // =====================================================================
    // DASHBOARD LOAD
    // =====================================================================
    async function loadDashboard() {
      if (!getToken()) return;
      try {
        const [sumRes, incRes] = await Promise.all([
          apiFetch('/api/v1/dashboard/summary'),
          apiFetch('/api/v1/incidents'),
        ]);
        if (sumRes.status === 401 || incRes.status === 401) return;
        if (!sumRes.ok || !incRes.ok) throw new Error('Could not load dashboard data.');

        state.summary = await sumRes.json();
        state.incidents = await incRes.json();
        state.lastUpdated = new Date();

        renderStats();
        renderTable();
        renderRecent();
        renderResponders();
        document.getElementById('last-updated').textContent =
          `· Updated ${state.lastUpdated.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
      } catch (err) {
        console.error('Dashboard load failed', err);
      }
    }

    function renderStats() {
      const s = state.summary || {};
      const cards = [
        ['Total incidents', s.total_incidents ?? 0],
        ['Active', s.active_incidents ?? 0],
        ['Critical', s.critical_incidents ?? 0],
        ['Responders', s.responders ?? 0],
        ['Available', s.available_responders ?? 0],
      ];
      document.getElementById('stats').innerHTML = cards.map(([label, value]) => `
        <div class="stat">
          <div class="stat-label">${esc(label)}</div>
          <div class="stat-value">${esc(value)}</div>
        </div>
      `).join('');
    }

    function filterIncidents() {
      return state.incidents.filter((i) => {
        if (state.statusFilter && i.status !== state.statusFilter) return false;
        if (state.priorityFilter && String(i.priority) !== state.priorityFilter) return false;
        if (state.search) {
          const hay = [
            i.incident_number, i.location_description, i.description, i.type?.name,
          ].filter(Boolean).join(' ').toLowerCase();
          if (!hay.includes(state.search.toLowerCase())) return false;
        }
        return true;
      });
    }

    function renderTable() {
      const rows = filterIncidents();
      const body = document.getElementById('incident-table-body');
      if (!rows.length) {
        body.innerHTML = '<tr><td colspan="6" class="muted" style="text-align:center; padding:24px;">No incidents match the current filters.</td></tr>';
        return;
      }
      body.innerHTML = rows.map((i) => `
        <tr data-incident-id="${esc(i.id)}" tabindex="0" class="${i.id === state.selectedIncidentId ? 'selected' : ''}">
          <td>${esc(i.incident_number)}</td>
          <td>${pill(i.status)}</td>
          <td>L${esc(i.priority)}</td>
          <td>${esc(i.type?.name || '—')}</td>
          <td>${esc(i.location_description || 'Unspecified')}</td>
          <td>${esc(fmtDate(i.created_at))}</td>
        </tr>
      `).join('');
      body.querySelectorAll('tr[data-incident-id]').forEach((row) => {
        row.addEventListener('click', () => selectIncident(row.getAttribute('data-incident-id')));
        row.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectIncident(row.getAttribute('data-incident-id')); }
        });
      });
    }

    function renderRecent() {
      const items = state.summary?.recent_incidents || [];
      const el = document.getElementById('recent-activity');
      if (!items.length) { el.innerHTML = '<div class="mini-card muted">No recent activity.</div>'; return; }
      el.innerHTML = items.map((item) => `
        <div class="mini-card" data-incident-id="${esc(item.id)}">
          <strong>${esc(item.incident_number)}</strong>
          <div class="mini-meta">${esc(item.location_description || 'Unspecified')} · ${esc(item.type || 'Other')}</div>
          <div class="mini-meta">${esc(fmtDate(item.created_at))}</div>
          <div style="margin-top:8px;">${pill(item.status)}</div>
        </div>
      `).join('');
      el.querySelectorAll('[data-incident-id]').forEach((card) => {
        card.addEventListener('click', () => selectIncident(card.getAttribute('data-incident-id')));
      });
    }

    function renderResponders() {
      const items = state.summary?.responders_detail || [];
      const el = document.getElementById('responder-panel');
      if (!items.length) { el.innerHTML = '<div class="mini-card muted">No responders on record.</div>'; return; }
      el.innerHTML = items.map((p) => `
        <div class="responder-card">
          <div class="responder-top">
            <strong style="font-size:13px;">${esc(p.name)}</strong>
            ${pill(p.status)}
          </div>
          <div class="responder-meta">${esc(p.responder_type)} · ${esc(p.phone || 'No phone')}</div>
        </div>
      `).join('');
    }

    // =====================================================================
    // INCIDENT DRAWER
    // =====================================================================
    async function selectIncident(id) {
      if (!id) return;
      state.selectedIncidentId = id;
      renderTable();
      await refreshDrawer();
    }

    async function refreshDrawer() {
      const id = state.selectedIncidentId;
      if (!id) return;
      try {
        const res = await apiFetch(`/api/v1/incidents/${id}`);
        if (!res.ok) throw new Error('Failed to load');
        renderDrawer(await res.json());
      } catch {
        document.getElementById('incident-drawer-content').innerHTML =
          '<div class="muted">Could not load this incident.</div>';
      }
    }

    function renderDrawer(incident) {
      document.getElementById('drawer-title').textContent = incident.incident_number;

      const assignments = (incident.assignments || []).map((a) => {
        const r = a.responder || {};
        return `<div><strong>${esc(r.name || 'Unknown')}</strong> · ${esc(r.responder_type || 'unit')} · ETA ${esc(a.eta_minutes || 0)} min · ${esc(a.status || '')}</div>`;
      }).join('') || '<div class="muted">No responder assigned yet.</div>';

      const nextStatuses = VALID_TRANSITIONS[incident.status] || [];
      const statusButtons = nextStatuses.length
        ? nextStatuses.map((s) => `
            <button class="btn btn-secondary btn-sm" data-action="set-status" data-status="${esc(s)}">
              → ${esc(s.replace(/_/g, ' '))}
            </button>`).join('')
        : '<span class="muted" style="font-size:12px;">No further transitions available.</span>';

      const history = (incident.status_history || incident.history || []).slice().reverse();
      const timeline = history.length
        ? `<div class="timeline">${history.map((h) => `
            <div class="tl-item">
              <div class="tl-dot"></div>
              <div class="tl-body">
                <strong>${esc((h.status || '').replace(/_/g, ' '))}</strong>
                ${h.note ? `<div>${esc(h.note)}</div>` : ''}
                <div class="muted" style="font-size:11px;">${esc(fmtDate(h.created_at))}</div>
              </div>
            </div>`).join('')}</div>`
        : '<div class="muted" style="font-size:12px;">No status history yet.</div>';

      document.getElementById('incident-drawer-content').innerHTML = `
        <div class="drawer-grid">
          <div class="row-flex">
            <span><strong>Case:</strong> ${esc(incident.incident_number)}</span>
            <button class="btn btn-ghost btn-sm" data-action="copy-case">Copy</button>
          </div>
          <div><strong>Status:</strong> ${pill(incident.status)}</div>
          <div><strong>Priority:</strong> Level ${esc(incident.priority)}</div>
          <div><strong>Type:</strong> ${esc(incident.type ? incident.type.name : 'Unspecified')}</div>
          <div><strong>Location:</strong> ${esc(incident.location_description || 'Unspecified')}</div>
          <div><strong>Description:</strong> ${esc(incident.description || '—')}</div>
          <div><strong>Casualties:</strong> ${esc(incident.casualty_count || 0)}</div>
          <div><strong>Reporter:</strong> ${esc(incident.reporter_phone || '—')}</div>
          <div><strong>Assigned:</strong> ${assignments}</div>
        </div>

        <div class="drawer-section">
          <h3>Dispatch</h3>
          <div id="candidate-list" class="responder-panel">
            <div class="muted" style="font-size:12px;">Loading candidates…</div>
          </div>
        </div>

        <div class="drawer-section">
          <h3>Change status</h3>
          <div class="action-row" id="status-actions">${statusButtons}</div>
        </div>

        <div class="drawer-section">
          <h3>Timeline</h3>
          ${timeline}
        </div>
      `;

      document.querySelectorAll('#status-actions [data-action="set-status"]').forEach((btn) => {
        btn.addEventListener('click', () => updateStatus(incident.id, btn.getAttribute('data-status')));
      });
      document.querySelectorAll('[data-action="copy-case"]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          try { await navigator.clipboard.writeText(incident.incident_number); toast('Case number copied.', 'success'); }
          catch { toast('Could not copy.', 'error'); }
        });
      });

      loadCandidates(incident.id);
      document.getElementById('incident-drawer').classList.add('visible');
    }

    async function loadCandidates(incidentId) {
      const el = document.getElementById('candidate-list');
      try {
        const res = await apiFetch(`/api/v1/dispatch/incidents/${incidentId}/candidates`);
        if (!res.ok) throw new Error('failed');
        const list = await res.json();
        if (!list.length) {
          el.innerHTML = '<div class="muted" style="font-size:12px;">No suitable responders available within range.</div>';
          return;
        }
        el.innerHTML = list.map((c) => `
          <div class="responder-card" data-responder-id="${esc(c.responder_id)}">
            <div class="responder-top">
              <strong style="font-size:13px;">${esc(c.name)}</strong>
              ${pill(c.status)}
            </div>
            <div class="responder-meta">${esc(c.responder_type)} · ${esc(c.distance_km)} km · ETA ${esc(c.eta_minutes)} min</div>
            <div style="margin-top:8px;">
              <button class="btn btn-green btn-sm" data-action="assign" data-responder-id="${esc(c.responder_id)}">Assign</button>
            </div>
          </div>
        `).join('');
        el.querySelectorAll('[data-action="assign"]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            assignResponder(incidentId, btn.getAttribute('data-responder-id'));
          });
        });
      } catch {
        el.innerHTML = '<div class="muted" style="font-size:12px;">Could not load candidates.</div>';
      }
    }

    async function assignResponder(incidentId, responderId) {
      try {
        const res = await apiFetch(`/api/v1/dispatch/incidents/${incidentId}/assign`, {
          method: 'POST',
          body: JSON.stringify({ responder_id: responderId, assignment_type: 'PRIMARY' }),
        });
        if (!res.ok) {
          const d = await res.json().catch(() => ({}));
          toast(d.detail || 'Could not assign responder.', 'error');
          return;
        }
        toast('Responder assigned.', 'success', 'Dispatch');
        await refreshDrawer();
        await loadDashboard();
      } catch (err) { toast(err.message || 'Network error.', 'error'); }
    }

    async function updateStatus(incidentId, status) {
      try {
        const res = await apiFetch(`/api/v1/incidents/${incidentId}/status`, {
          method: 'PATCH',
          body: JSON.stringify({ status, note: 'Changed from admin dashboard' }),
        });
        if (!res.ok) {
          const d = await res.json().catch(() => ({}));
          toast(d.detail || 'Could not change status.', 'error');
          return;
        }
        toast(`Status set to ${status.replace(/_/g, ' ')}`, 'success', 'Updated');
        await refreshDrawer();
        await loadDashboard();
      } catch (err) { toast(err.message || 'Network error.', 'error'); }
    }

    // =====================================================================
    // AI ASSISTANT
    // =====================================================================
    function appendChat(role, text) {
      const thread = document.getElementById('chat-thread');
      const el = document.createElement('div');
      el.className = `msg ${role}`;
      el.textContent = text; // textContent is safe
      thread.appendChild(el);
      thread.scrollTop = thread.scrollHeight;
    }

    async function sendAssistantMessage() {
      const input = document.getElementById('assistant-input');
      const message = input.value.trim();
      if (!message) return;
      appendChat('user', message);
      input.value = '';
      try {
        const res = await apiFetch('/api/v1/assistant/chat', {
          method: 'POST',
          body: JSON.stringify({
            message,
            incident_id: state.selectedIncidentId,
            user_role: (getUser()?.role || 'dispatcher').toLowerCase(),
          }),
        });
        const d = await res.json();
        appendChat('ai', d.reply || 'No reply generated.');
      } catch {
        appendChat('ai', 'The assistant is offline right now.');
      }
    }

    // =====================================================================
    // CSV EXPORT
    // =====================================================================
    function exportCSV() {
      const rows = filterIncidents();
      if (!rows.length) { toast('Nothing to export.', 'warn'); return; }
      const headers = ['incident_number', 'status', 'priority', 'type', 'location', 'casualties', 'created_at'];
      const lines = [headers.join(',')];
      for (const r of rows) {
        const values = [
          r.incident_number, r.status, r.priority, r.type?.name || '',
          (r.location_description || '').replace(/,/g, ' '),
          r.casualty_count || 0, r.created_at,
        ];
        lines.push(values.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(','));
      }
      const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ajali-incidents-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      toast(`Exported ${rows.length} incidents.`, 'success');
    }

    // =====================================================================
    // EVENT WIRING
    // =====================================================================
    document.getElementById('login-btn').addEventListener('click', doLogin);
    document.getElementById('login-password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
    document.getElementById('refresh-btn').addEventListener('click', loadDashboard);
    document.getElementById('export-btn').addEventListener('click', exportCSV);
    document.getElementById('open-citizen-btn').addEventListener('click', () => { window.location.href = 'index.html'; });
    document.getElementById('drawer-close').addEventListener('click', closeDrawer);
    document.getElementById('assistant-send').addEventListener('click', sendAssistantMessage);
    document.getElementById('assistant-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendAssistantMessage(); });

    document.getElementById('search-input').addEventListener('input', (e) => { state.search = e.target.value; renderTable(); });
    document.getElementById('status-filter').addEventListener('change', (e) => { state.statusFilter = e.target.value; renderTable(); });
    document.getElementById('priority-filter').addEventListener('change', (e) => { state.priorityFilter = e.target.value; renderTable(); });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      try {
        await fetch(`${API}/api/v1/auth/logout`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: getRefresh() }),
        });
      } catch {}
      stopDashboard();
      clearSession();
      window.location.reload();
    });

    function closeDrawer() {
      document.getElementById('incident-drawer').classList.remove('visible');
      state.selectedIncidentId = null;
      renderTable();
    }

    document.addEventListener('keydown', (e) => {
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea') return;
      if (e.key === 'Escape') closeDrawer();
      if (e.key.toLowerCase() === 'r' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); loadDashboard(); }
    });

    // =====================================================================
    // BOOT
    // =====================================================================
    function startDashboard() {
      loadDashboard();
      connectWS();
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(() => { if (getToken()) loadDashboard(); }, POLL_INTERVAL_MS);
    }
    function stopDashboard() {
      disconnectWS();
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    (async () => {
      renderUserChip();
      appendChat('ai', 'Ask me to summarise an incident, recommend responder types, or check status.');

      if (getToken()) {
        try {
          const r = await apiFetch('/api/v1/auth/me');
          if (r.ok) {
            const me = await r.json();
            if (hasValidRole(me.role)) {
              localStorage.setItem(USER_KEY, JSON.stringify(me));
              renderUserChip();
              startDashboard();
              return;
            }
            clearSession();
          } else {
            clearSession();
          }
        } catch {}
      }
      showLogin();
    })();
  </script>
</body>
</html>
